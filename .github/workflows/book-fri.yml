# AUTO-GENERATED by scripts/gen_workflow.py — edit classes.yml then regenerate.
# Scheduled classes only; manual one-off actions live in manual.yml instead.
name: Book YMCA classes — Fri

on:
  schedule:
    - cron: "0 17 * * 5"  # core-fri — opens Fri 10:45 PT (PDT, primary, fire -45m)
    - cron: "0 18 * * 5"  # core-fri — opens Fri 10:45 PT (PST, primary, fire -45m)
    - cron: "15 17 * * 5"  # core-fri — opens Fri 10:45 PT (PDT, retry 1, fire -30m)
    - cron: "15 18 * * 5"  # core-fri — opens Fri 10:45 PT (PST, retry 1, fire -30m)
    - cron: "30 17 * * 5"  # core-fri — opens Fri 10:45 PT (PDT, retry 2, fire -15m)
    - cron: "30 18 * * 5"  # core-fri — opens Fri 10:45 PT (PST, retry 2, fire -15m)
    - cron: "35 18 * * 5"  # lift-hiit-fri — opens Fri 12:20 PT (PDT, primary, fire -45m)
    - cron: "35 19 * * 5"  # lift-hiit-fri — opens Fri 12:20 PT (PST, primary, fire -45m)
    - cron: "50 18 * * 5"  # lift-hiit-fri — opens Fri 12:20 PT (PDT, retry 1, fire -30m)
    - cron: "50 19 * * 5"  # lift-hiit-fri — opens Fri 12:20 PT (PST, retry 1, fire -30m)
    - cron: "5 19 * * 5"  # lift-hiit-fri — opens Fri 12:20 PT (PDT, retry 2, fire -15m)
    - cron: "5 20 * * 5"  # lift-hiit-fri — opens Fri 12:20 PT (PST, retry 2, fire -15m)

concurrency:
  group: book-fri-${{ github.run_id }}

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Book
        env:
          EGYM_USERNAME: ${{ secrets.EGYM_USERNAME }}
          EGYM_PASSWORD: ${{ secrets.EGYM_PASSWORD }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/run_due.py
