name: Book YMCA classes — Thu

on:
  schedule:
    - cron: "10 16 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PDT, primary, fire -50m)
    - cron: "10 17 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PST, primary, fire -50m)
    - cron: "15 16 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PDT, retry 1, fire -45m)
    - cron: "15 17 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PST, retry 1, fire -45m)
    - cron: "30 16 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PDT, retry 2, fire -30m)
    - cron: "30 17 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PST, retry 2, fire -30m)
    - cron: "45 16 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PDT, retry 3, fire -15m)
    - cron: "45 17 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PST, retry 3, fire -15m)
    - cron: "50 16 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PDT, retry 4, fire -10m)
    - cron: "50 17 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PST, retry 4, fire -10m)
    - cron: "55 16 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PDT, retry 5, fire -5m)
    - cron: "55 17 * * 4"  # bodypump-thu — opens Thu 10:00 PT (PST, retry 5, fire -5m)
    - cron: "30 17 * * 4"  # cycle-sculpt-thu — opens Thu 11:15 PT (PDT, primary, fire -45m)
    - cron: "30 18 * * 4"  # cycle-sculpt-thu — opens Thu 11:15 PT (PST, primary, fire -45m)
    - cron: "45 17 * * 4"  # cycle-sculpt-thu — opens Thu 11:15 PT (PDT, retry 1, fire -30m)
    - cron: "45 18 * * 4"  # cycle-sculpt-thu — opens Thu 11:15 PT (PST, retry 1, fire -30m)
    - cron: "0 18 * * 4"  # cycle-sculpt-thu — opens Thu 11:15 PT (PDT, retry 2, fire -15m)
    - cron: "0 19 * * 4"  # cycle-sculpt-thu — opens Thu 11:15 PT (PST, retry 2, fire -15m)

concurrency:
  group: book-thu-${{ github.run_id }}

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Book
        env:
          EGYM_USERNAME: ${{ secrets.EGYM_USERNAME }}
          EGYM_PASSWORD: ${{ secrets.EGYM_PASSWORD }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/run_due.py
