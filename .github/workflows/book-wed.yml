# AUTO-GENERATED by scripts/gen_workflow.py — edit classes.yml then regenerate.
# Scheduled classes only; manual one-off actions live in manual.yml instead.
name: Book YMCA classes — Wed

on:
  schedule:
    - cron: "45 9 * * 3"  # rpm-wed — opens Wed 10:30 PT (primary, fire -45m)
      timezone: "America/Los_Angeles"
    - cron: "0 10 * * 3"  # rpm-wed — opens Wed 10:30 PT (retry 1, fire -30m)
      timezone: "America/Los_Angeles"
    - cron: "15 10 * * 3"  # rpm-wed — opens Wed 10:30 PT (retry 2, fire -15m)
      timezone: "America/Los_Angeles"
    - cron: "45 10 * * 3"  # core-wed — opens Wed 11:30 PT (primary, fire -45m)
      timezone: "America/Los_Angeles"
    - cron: "0 11 * * 3"  # core-wed — opens Wed 11:30 PT (retry 1, fire -30m)
      timezone: "America/Los_Angeles"
    - cron: "15 11 * * 3"  # core-wed — opens Wed 11:30 PT (retry 2, fire -15m)
      timezone: "America/Los_Angeles"

concurrency:
  group: book-wed-${{ github.run_id }}

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Book
        env:
          EGYM_USERNAME: ${{ secrets.EGYM_USERNAME }}
          EGYM_PASSWORD: ${{ secrets.EGYM_PASSWORD }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/run_due.py
