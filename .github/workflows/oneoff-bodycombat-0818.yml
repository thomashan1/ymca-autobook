# TEMPORARY — delete once it has run (see the tracking note in the PR).
#
# One-off: book BODYCOMBAT Tue 2026-08-18 09:50 at Northwest (occurrence 298819)
# the instant its window opens, Tue 2026-08-11 10:50 PT. The class fills fast,
# so waiting to dispatch it by hand risks losing the spot.
#
# Fires *before* the open time and lets book_by_id() sit on wait_until(), rather
# than trying to land a cron on the exact minute — GitHub's cron queue runs late
# often enough that the generated crons in book.yml use the same -25m/-15m
# pattern. The second fire is a backstop if GitHub drops the first; it no-ops
# once the class is booked.
#
# Deliberately its own file rather than a line in book.yml: editing book.yml
# re-registers its schedule, and that has already cost a morning's booking runs
# once (CLAUDE.md, 2026-07-30).
name: One-off book BODYCOMBAT 8/18

on:
  schedule:
    - cron: "25 17 11 8 *"  # 10:25 PT — 25m before the 10:50 PT open
    - cron: "35 17 11 8 *"  # 10:35 PT — backstop
  workflow_dispatch: {}

concurrency:
  group: oneoff-bodycombat-0818

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Book occurrence 298819
        env:
          EGYM_USERNAME: ${{ secrets.EGYM_USERNAME }}
          EGYM_PASSWORD: ${{ secrets.EGYM_PASSWORD }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # cron carries no year, so a forgotten copy of this file would fire
          # again next 8/11. Make that a no-op instead of a mystery booking.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" != "2026-08-11" ]; then
            echo "Not 2026-08-11 — stale cron, doing nothing. This file should have been deleted."
            exit 0
          fi
          python -m src.main --book-id 298819
