name: Regenerate booking cron

# When classes.yml changes on main (e.g. the iOS app deletes a class), the
# per-class cron in book.yml can go stale. This regenerates it and opens an
# auto-merging PR, so cron cleanup happens automatically without a human step.
on:
  push:
    branches: [main]
    paths: ["classes.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regen-book
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Regenerate book.yml
        run: python scripts/gen_workflow.py
      - name: Open PR if book.yml changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet .github/workflows/book.yml; then
            echo "book.yml already matches classes.yml — nothing to do."
            exit 0
          fi
          branch="auto/regen-book-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/workflows/book.yml
          git commit -m "Regenerate book.yml cron from classes.yml"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Regenerate booking cron from classes.yml" \
            --body "Automated: classes.yml changed, so book.yml's per-class cron was regenerated by scripts/gen_workflow.py."
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
