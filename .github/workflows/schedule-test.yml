# TEMPORARY — throwaway test of whether GitHub's scheduler is firing at all for
# this repo right now, after the 2026-08-31 hard-reset (delete step). Two fires
# today only, ~20 and ~35 min out, to get a same-afternoon signal instead of
# waiting for tomorrow's real BODYPUMP window. Delete this file once we have an
