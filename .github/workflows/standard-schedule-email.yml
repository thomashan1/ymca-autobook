name: Standard schedule email

on:
  schedule:
    # Sun 17:52 PT, aiming to land ~6pm. Both DST crons fire; the script checks
    # which one triggered (github.event.schedule) and lets only the matching one
    # send. :52 rather than :00 — the old "0 1 * * 1" sat in GitHub's
    # top-of-hour queue and delivered 3.5h late, at 9:30pm.
    - cron: "52 0 * * 1"  # Sun 17:52 PT (PDT = UTC-7)
    - cron: "52 1 * * 1"  # Sun 17:52 PT (PST = UTC-8)
  workflow_dispatch: {}

concurrency:
  group: standard-schedule-email-${{ github.run_id }}

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send standard schedule email
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python scripts/standard_schedule_email.py
