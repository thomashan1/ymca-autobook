name: Standard schedule email

on:
  # The lineup only changes when classes.yml changes, so send it then instead of
  # every Sunday. Covers the iOS app's auto-merging delete PRs too — they land on
  # main as a normal push. Regenerating book.yml afterwards touches only
  # .github/workflows, so it won't fire a second mail.
  push:
    branches: [main]
    paths:
      - classes.yml
  workflow_dispatch: {}

concurrency:
  # Collapse a burst of pushes into one email (the old group keyed on run_id, so
  # it never actually deduplicated anything).
  group: standard-schedule-email
  cancel-in-progress: true

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send standard schedule email
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python scripts/standard_schedule_email.py
