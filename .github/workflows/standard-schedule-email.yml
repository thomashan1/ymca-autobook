name: Standard schedule email

on:
  # Manual only since 2026-10-14: classes.yml moved to the private repo, and a
  # push there can't trigger a workflow here.
  workflow_dispatch: {}

concurrency:
  # Collapse a burst of pushes into one email (the old group keyed on run_id, so
  # it never actually deduplicated anything).
  group: standard-schedule-email
  cancel-in-progress: true

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send standard schedule email
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python scripts/standard_schedule_email.py
